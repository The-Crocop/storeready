name: StorePreflight
description: Preflight compliance checks for iOS IPA and Android AAB release artifacts
author: StorePreflight
branding:
  icon: check-circle
  color: green
inputs:
  artifact:
    description: Path to the .ipa or .aab artifact
    required: true
  baseline:
    description: Optional StorePreflight approved-release baseline JSON
    required: false
    default: ""
  fail-on-warning:
    description: Fail the job when warnings are found
    required: false
    default: "false"
  project:
    description: Optional StorePreflight Cloud project key. When set, the scan is uploaded.
    required: false
    default: ""
  cloud-url:
    description: StorePreflight Cloud base URL
    required: false
    default: ""
  api-key:
    description: StorePreflight Cloud API key. Pass a GitHub secret.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false
    - name: Build StorePreflight
      shell: bash
      run: go build -o "$RUNNER_TEMP/storepreflight" ./cmd/storepreflight
      working-directory: ${{ github.action_path }}
    - name: Scan release artifact
      shell: bash
      env:
        STOREPREFLIGHT_ARTIFACT: ${{ inputs.artifact }}
        STOREPREFLIGHT_BASELINE: ${{ inputs.baseline }}
        STOREPREFLIGHT_FAIL_ON_WARNING: ${{ inputs.fail-on-warning }}
        STOREPREFLIGHT_PROJECT: ${{ inputs.project }}
        STOREPREFLIGHT_CLOUD_URL: ${{ inputs.cloud-url }}
        STOREPREFLIGHT_API_KEY: ${{ inputs.api-key }}
      run: "${{ github.action_path }}/scripts/action.sh"
